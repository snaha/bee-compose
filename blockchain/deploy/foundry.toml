# Foundry project that COMPILES the Swarm contracts. It does not deploy them:
# blockchain/bake/deploy-swarm.ts reads the artifacts out of out/ and sends the
# deploy transactions itself, so each contract lands on its Gnosis mainnet
# address (see blockchain/HYBRID-CHAIN.md).
#
# storage-incentives builds against OpenZeppelin 4.x, wired in through a
# path-scoped remapping in remappings.txt.
#
# solc and the optimizer are pinned to what Gnosis mainnet's own deployments
# were verified with (0.8.19, optimizer on, 1000 runs, EVM paris) rather than
# left to auto-detect. These contracts stand in for those, so they should be
# compiled the same way — and pinning keeps a bake reproducible instead of
# drifting with whatever solc release is newest.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.19"
evm_version = "paris"
auto_detect_remappings = false   # we set them explicitly in remappings.txt
optimizer = true
optimizer_runs = 1000
