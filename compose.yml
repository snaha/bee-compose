name: bee-compose

# Reusable bee env block. Everything that's identical across queen + workers lives here.
# The contract addresses below are baked into blockchain/state.gnosis.json by
# blockchain/bake/bake.sh; re-bake and update them together.
x-bee-env: &bee-env
  BEE_WARMUP_TIME: 10s
  BEE_PASSWORD: password
  BEE_VERBOSITY: "4"
  BEE_MAINNET: "false"
  BEE_BLOCK_TIME: "5"
  BEE_API_ADDR: 0.0.0.0:1633
  BEE_CORS_ALLOWED_ORIGINS: "*"
  BEE_ALLOW_PRIVATE_CIDRS: "true"
  BEE_BOOTNODE_MODE: "false"
  # NOTE: the blockchain RPC endpoint is NOT set here — it's passed as the
  # --blockchain-rpc-endpoint CLI flag via the x-bee-command anchor below.
  # Bee 2.8.0 moved this option to the nested config key "blockchain-rpc.endpoint",
  # and bee's viper env-key replacer only maps "-"->"_" (not "."), so the old
  # BEE_BLOCKCHAIN_RPC_ENDPOINT env var no longer reaches it (it silently stays
  # empty and the node fails with "init chain: dial blockchain client"). The
  # separate --swap-endpoint flag (BEE_SWAP_ENDPOINT) was also removed in 2.8.0;
  # swap now reuses the single blockchain RPC endpoint.
  # The Gnosis mainnet addresses (docs.ethswarm.org/docs/references/smart-contracts).
  # On this chain they hold contracts deployed FROM SOURCE at bake time, placed
  # on those addresses by impersonating each one's original deployer — so the
  # app, which resolves addresses from the chain id, finds what it expects while
  # the batch tree starts empty. See blockchain/HYBRID-CHAIN.md.
  BEE_POSTAGE_STAMP_ADDRESS: "0x45a1502382541Cd610CC9068e88727426b696293"
  BEE_PRICE_ORACLE_ADDRESS: "0x47EeF336e7fE5bED98499A4696bce8f28c1B0a8b"
  BEE_STAKING_ADDRESS: "0xda2a16EE889E7F04980A8d597b48c8D51B9518F4"
  BEE_REDISTRIBUTION_ADDRESS: "0x5069cdfB3D9E56d23B1cAeE83CE6109A7E4fd62d"
  # The block PostageStamp was deployed in. Anything later hides the initial
  # price update and every BatchCreated event from the nodes; anything much
  # earlier only costs a slower scan. Written by blockchain/bake/finalise.ts on
  # every bake — don't hand-edit it, re-bake.
  BEE_POSTAGE_STAMP_START_BLOCK: "47718897"
  # A chequebook needs xBZZ and a factory deployment; uploading with your own
  # stamps needs neither.
  BEE_SWAP_ENABLE: "false"
  # The p2p network id is the swarm's identity, unrelated to the chain id —
  # this keeps the cluster private even though it follows Gnosis.
  BEE_NETWORK_ID: "4020"

# Bee start command shared by queen + workers. The blockchain RPC endpoint must
# be a CLI flag rather than an env var — see the NOTE in x-bee-env above. The
# pflag is bound to the nested config key bee 2.8.0 reads, so the flag works.
x-bee-command: &bee-command ["start", "--blockchain-rpc-endpoint", "http://blockchain:9545"]

# Shared worker scaffolding. Each worker service still needs its own image,
# volume, and ports because identities are baked at build time. environment
# is set per-service (not here) so each worker's BEE_FULL_NODE / BEE_BOOTNODE
# can be controlled independently — the CLI flips BEE_WORKER_N_FULL to switch
# a given worker between light and full at start time.
x-worker: &worker-defaults
  profiles: ["workers"]
  restart: unless-stopped
  depends_on:
    - queen
  command: *bee-command

services:
  blockchain:
    # Anvil booted from the hybrid snapshot: mainnet's BZZ token and SushiSwap
    # pools, the Swarm contracts deployed on top, the 9 Bee node EOAs funded
    # with xDAI for gas and BZZ for their own postage, and a dev faucet holding
    # a BZZ float. Starts in <1s and needs no internet. See blockchain/Dockerfile.
    build:
      context: ./blockchain
      args:
        FOUNDRY_VERSION: ${FOUNDRY_VERSION:-stable}
    image: bee-compose:blockchain-${FOUNDRY_VERSION:-stable}
    container_name: bee-compose-blockchain
    restart: unless-stopped
    ports:
      - "127.0.0.1:9545:9545"
    volumes:
      - blockchain:/data
    healthcheck:
      test:
        - CMD-SHELL
        - "cast block-number --rpc-url http://localhost:9545 >/dev/null 2>&1 || exit 1"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  queen:
    build:
      context: ./bee
      args:
        BEE_VERSION: ${BEE_VERSION:-2.8.0}
        ROLE: queen
    image: bee-compose:queen-${BEE_VERSION:-2.8.0}
    container_name: bee-compose-queen
    restart: unless-stopped
    depends_on:
      blockchain:
        condition: service_healthy
    ports:
      - "127.0.0.1:1633:1633"
      - "127.0.0.1:1634:1634"
    volumes:
      - queen:/home/bee/.bee
    command: *bee-command
    environment:
      <<: *bee-env
      BEE_FULL_NODE: "true"
      BEE_WELCOME_MESSAGE: "bee-compose queen"

  worker-1:
    <<: *worker-defaults
    build:
      context: ./bee
      args:
        BEE_VERSION: ${BEE_VERSION:-2.8.0}
        ROLE: worker-1
    image: bee-compose:worker-1-${BEE_VERSION:-2.8.0}
    container_name: bee-compose-worker-1
    ports:
      - "127.0.0.1:16331:1633"
      - "127.0.0.1:16341:1634"
    volumes:
      - worker-1:/home/bee/.bee
    environment:
      <<: *bee-env
      BEE_FULL_NODE: ${BEE_WORKER_1_FULL:-false}
      BEE_BOOTNODE: ${QUEEN_BOOTNODE:-}

  worker-2:
    <<: *worker-defaults
    build:
      context: ./bee
      args:
        BEE_VERSION: ${BEE_VERSION:-2.8.0}
        ROLE: worker-2
